        body { margin: 0; padding: 0; font-family: 'Cinzel', serif; background-color: #000; }
        .contenedor-principal { width: 100%; max-width: 500px; margin: 0 auto; position: relative; }
        .foto-seccion { width: 100%; display: block; height: auto; }
 
        /* ANIMACIONES */
        @keyframes entrarElegante { from { opacity: 0; transform: translateY(50px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes entrarLateral { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes animPadre { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes dinamico { 0% { transform: scale(0.5) rotate(-10deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
 
        .animar-fecha, .animar-lugar, .animar-entrada, .animar-dinamico { opacity: 0; }
        
        .visible { animation: entrarElegante 1s ease-out forwards; }
        .visible-lugar { animation: entrarLateral 1s ease-out forwards; }
        .animar-entrada.visible { animation: animPadre 1s ease-out forwards; }
        .animar-dinamico.visible { animation: dinamico 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
 
        /* OVERLAY */
        #overlay { 
            position: fixed; top: 0; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 500px; height: 100%; 
            background-color: #000; 
            background-image: url('foto.jpg'); 
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            z-index: 9999; display: flex; align-items: center; justify-content: center; 
            transition: opacity 1s ease; 
        }
        .ocultar { opacity: 0; pointer-events: none; }
        
        /* BOTÓN AJUSTADO */
        .btn-entrar { 
            padding: 10px 15px; 
            font-size: 14px; 	
            cursor: pointer; 
            background: rgba(0, 0, 0, 0.5); 
            color: white; 
            border: 1px solid white; 
            font-family: 'Cinzel', serif; 
            border-radius: 5px; 
            width: auto; 
            white-space: nowrap;
        }
        
        #control-musica { position: fixed; top: 20px; right: -50px; z-index: 9999; background: #87CEEB; padding: 12px; border-radius: 50%; transition: right 0.5s ease; cursor: pointer; box-shadow: 0 0 10px rgba(135, 206, 235, 0.5); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
        .mostrar-musica { right: 20px !important; }
        
        .contenedor-portada { position: relative; z-index: 1; }
        
        #contador-contenedor { position: absolute; bottom: 5%; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 10; }
        .box-c { text-align: center; border: 1px solid rgba(255, 255, 255, 0.7); padding: 5px; width: 20%; background-color: rgba(0, 0, 0, 0.4); }
        .num-c { font-size: clamp(16px, 5vw, 24px); color: white; }
        .lab-c { font-size: clamp(8px, 2vw, 10px); color: white; text-transform: uppercase; }
        
        .contenedor-btn { position: absolute; bottom: 3%; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .btn-ubicacion { padding: 15px 0; width: 80%; max-width: 300px; background-color: white; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 18px; text-align: center; }

    <script>
        const audio = document.getElementById("musica");
        const iconoMusica = document.getElementById("icono-musica");

        const svgPlay = '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>';
        const svgPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        function iniciarInvitacion() {
            audio.play();
            iconoMusica.innerHTML = svgPause;
            document.getElementById("overlay").classList.add('ocultar');
            document.getElementById("control-musica").classList.add('mostrar-musica');
            setTimeout(() => { document.getElementById("overlay").style.display = "none"; }, 1000);
        }

        function toggleMusica() {
            if (audio.paused) {
                audio.play();
                iconoMusica.innerHTML = svgPause;
            } else {
                audio.pause();
                iconoMusica.innerHTML = svgPlay;
            }
        }
 
        const observerOptions = { threshold: 0.2 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                   entry.target.classList.remove('visible', 'visible-lugar');
                   void entry.target.offsetWidth; 
                   if (entry.target.classList.contains('animar-lugar')) { entry.target.classList.add('visible-lugar'); }
                   else { entry.target.classList.add('visible'); }
                } else { entry.target.classList.remove('visible', 'visible-lugar'); }
            });
        }, observerOptions);
 
        document.querySelectorAll('.animar-fecha, .animar-lugar, .animar-entrada, .animar-dinamico').forEach(el => observer.observe(el));
 
        const cuenta = new Date("Aug 15, 2026 21:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime(), dist = cuenta - now;
            document.getElementById("dias").innerHTML = Math.floor(dist / (1000*60*60*24)).toString().padStart(2, '0');
            document.getElementById("horas").innerHTML = Math.floor((dist % (1000*60*60*24)) / (1000*60*60)).toString().padStart(2, '0');
            document.getElementById("minutos").innerHTML = Math.floor((dist % (1000*60*60)) / (1000*60)).toString().padStart(2, '0');
            document.getElementById("segundos").innerHTML = Math.floor((dist % (1000*60)) / 1000).toString().padStart(2, '0');
        }, 1000);
 
        let currentIndex = 0;
        const fotos = document.querySelectorAll('.foto-carrusel');
        setInterval(() => {
            fotos[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % fotos.length;
            fotos[currentIndex].classList.add('active');
        }, 2000);
    




// ======================================================
// URL DE GOOGLE APPS SCRIPT
// ======================================================

const API_URL =
'https://script.google.com/macros/s/AKfycbyhKAlP-qujK1wFTBLsXt5x4jvJ3IEp39z7tKjiKAmcYCUZVgSn0kCVj-H4uohPJ4hx/exec'


// ======================================================
// LLAMAR API
// ======================================================

function llamarAPI(parametros){

return new Promise((resolve,reject)=>{

const callback=
'cb_'+
Date.now()+
'_'+
Math.floor(
Math.random()*9999
);

const script=
document.createElement('script');

const query=
new URLSearchParams({

...parametros,

callback:callback

});


const tiempo=
setTimeout(()=>{

limpiar();

reject();

},15000);


window[callback]=function(data){

clearTimeout(tiempo);

limpiar();

resolve(data);

};


function limpiar(){

delete window[callback];

if(script.parentNode){

script.parentNode.removeChild(
script
);

}

}


script.onerror=function(){

clearTimeout(tiempo);

limpiar();

reject();

};


script.src=
API_URL+
'?'+
query.toString();


document.body.appendChild(
script
);

});

}


// ======================================================
// ENVIAR
// ======================================================

async function enviar(){

const nombre1=
document
.getElementById('nombre1')
.value
.trim();


const nombre2=
document
.getElementById('nombre2')
.value
.trim();


const a1=
document.querySelector(
'input[name="a1"]:checked'
)?.value || '';


const a2=
document.querySelector(
'input[name="a2"]:checked'
)?.value || '';


const mensaje=
document.getElementById(
'mensaje'
);


const pases=
document.getElementById(
'pases'
);


const boton=
document.getElementById(
'boton'
);


// ==========================================
// VALIDAR NOMBRE 1
// ==========================================

if(!nombre1){

mensaje.className=
'mensaje visible';

mensaje.textContent=
'Escribe el nombre del invitado 1.';

return;

}


if(
nombre1.split(/\s+/).length<3
){

mensaje.className=
'mensaje visible';

mensaje.textContent=
'Escribe el nombre completo del invitado 1.';

return;

}


if(!a1){

mensaje.className=
'mensaje visible';

mensaje.textContent=
'Selecciona la asistencia del invitado 1.';

return;

}


// ==========================================
// VALIDAR NOMBRE 2
// ==========================================

if(
nombre2 &&
nombre2.split(/\s+/).length<3
){

mensaje.className=
'mensaje visible';

mensaje.textContent=
'Escribe el nombre completo del invitado 2.';

return;

}


if(
nombre2 &&
!a2
){

mensaje.className=
'mensaje visible';

mensaje.textContent=
'Selecciona la asistencia del invitado 2.';

return;

}


boton.disabled=true;

boton.textContent=
'Enviando...';


try{


const respuesta=
await llamarAPI({

accion:'confirmar',

invitado1:nombre1,

asistencia1:a1,

invitado2:nombre2,

asistencia2:a2

});


if(!respuesta.ok){

mensaje.className=
'mensaje visible';

mensaje.textContent=
respuesta.mensaje;

return;

}


mensaje.className=
'mensaje visible';

mensaje.textContent=
respuesta.mensaje;


// ==========================================
// MOSTRAR PASES
// ==========================================

if(
respuesta.listaPases &&
respuesta.listaPases.length
){

pases.className=
'pases visible';

pases.innerHTML='';


respuesta.listaPases.forEach(
function(p,index){

const idPase=
'pase_'+
index+
'_'+
Date.now();


pases.innerHTML+=`

<div class="pase">


<!-- ====================================
     ESTE CONTENIDO ES EL QUE SE DESCARGA
     ==================================== -->

<div
class="contenido-pase"
id="${idPase}"
>


<div class="pase-titulo">
Pase de entrada
</div>


<div class="pase-linea"></div>


<div class="pase-nombre">
${escapar(p.nombre)}
</div>


<div class="codigo">
${escapar(p.codigo)}
</div>


<div class="codigo-texto">
Código de acceso
</div>


</div>


<!-- ====================================
     BOTON FUERA DEL PASE
     ==================================== -->

<button
type="button"
class="boton-descargar"
onclick="descargarPase('${idPase}',this)"
>
Descargar pase
</button>

`;

});

}

catch(error){

// ======================================================
// DESCARGAR PASE
// ======================================================

async function descargarPase(
idPase,
boton
){

const contenido=
document.getElementById(
idPase
);


if(!contenido){

return;

}


boton.disabled=true;

boton.textContent=
'Preparando pase...';


try{


// ==========================================
// CARGAR HTML2CANVAS
// ==========================================

if(!window.html2canvas){

await new Promise(
(resolve,reject)=>{

const script=
document.createElement(
'script'
);


script.src=
'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';


script.onload=
resolve;


script.onerror=
reject;


document.head.appendChild(
script
);

}
);

}


// ==========================================
// CREAR IMAGEN
// ==========================================

const canvas=
await html2canvas(
contenido,
{

scale:3,

backgroundColor:
'#000000',

useCORS:true,

logging:false,

imageTimeout:15000,

allowTaint:false

}
);


// ==========================================
// NOMBRE DEL INVITADO
// ==========================================

const nombre=
contenido
.querySelector(
'.pase-nombre'
)
.textContent
.trim();


const nombreArchivo=
nombre

.replace(
/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g,
''
)

.replace(
/\s+/g,
'-'
)

.substring(
0,
50
)

||
'Invitado';


// ==========================================
// DESCARGAR PNG
// ==========================================

canvas.toBlob(
function(blob){

if(!blob){

throw new Error(
'No se pudo generar la imagen.'
);

}


const url=
URL.createObjectURL(
blob
);


const enlace=
document.createElement(
'a'
);


enlace.href=
url;


enlace.download=
'Pase-'+
nombreArchivo+
'.png';


document.body.appendChild(
enlace
);


enlace.click();


document.body.removeChild(
enlace
);


setTimeout(
function(){

URL.revokeObjectURL(
url
);

},
1000
);


},
'image/png'
);


}


catch(error){

console.error(error);

alert(
'No se pudo descargar el pase. Intenta nuevamente.'
);

}


finally{

boton.disabled=false;

boton.textContent=
'Descargar pase';

}

}


// ======================================================
// ESCAPAR TEXTO
// ======================================================

function escapar(texto){

return String(texto)

.replace(
/&/g,
'&amp;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/'/g,
'&#039;'
);

}
